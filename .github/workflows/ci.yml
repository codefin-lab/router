name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (Node.js 24)

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build
        run: cargo build --locked -p apollo-router --release

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (Node.js 24)

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Linux test dependencies
        run: |
          sudo apt-get install -y libdw-dev pkg-config
          pkg-config --modversion libdw

      - name: Release evidence guard tests
        run: python3 -m unittest discover -s scripts -p 'test_va017*.py' -v

      - name: Fork regression test discovery
        run: |
          cargo test --locked -p apollo-router --lib va017 -- --list > /tmp/va017-tests.txt
          cat /tmp/va017-tests.txt
          test "$(grep -c ': test$' /tmp/va017-tests.txt)" -ge 4

      - name: Fork regression tests
        run: cargo test --locked -p apollo-router --lib va017

      - name: License report tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib license_enforcement

      - name: State machine tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib state_machine

      - name: HTTP factory tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib axum_http_server_factory

      - name: Gateway compatibility tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p apollo-router --lib -- --list > /tmp/router-tests.txt
          for suite in feature_gate_enforcement plugins::authentication plugins::authorization plugins::subscription file_uploads services::hickory_dns_connector services::http::service plugins::telemetry::reload plugins::rhai services::supergraph; do
            grep -F "$suite" /tmp/router-tests.txt | grep -q ': test$'
            cargo test --locked -p apollo-router --lib "$suite"
          done

      - name: Security backport HTTP integration tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p apollo-router --test integration_tests internal_query_planner_error_is_redacted_from_client_response
          cargo test --locked -p apollo-router --test integration_tests client_errors_omit_rhai
          cargo test --locked -p apollo-router --test integration_tests cancelled_by_rhai
          cargo test --locked -p apollo-router --test integration_tests integration::query_planner::fed2_schema_with_new_qp
