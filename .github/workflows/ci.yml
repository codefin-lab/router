name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build
        run: cargo build --locked -p apollo-router --release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Linux test dependencies
        run: |
          sudo apt-get install -y libdw-dev pkg-config
          pkg-config --modversion libdw

      - name: Fork regression test discovery
        run: |
          cargo test --locked -p apollo-router --lib va017 -- --list > /tmp/va017-tests.txt
          cat /tmp/va017-tests.txt
          test "$(grep -c ': test$' /tmp/va017-tests.txt)" -ge 4

      - name: Fork regression tests
        run: cargo test --locked -p apollo-router --lib va017

      - name: License report tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib license_enforcement

      - name: State machine tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib state_machine

      - name: HTTP factory tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p apollo-router --lib axum_http_server_factory
