name: Candidate image security report
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate without registry publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfiles/diy/dockerfiles/Dockerfile.repo
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: router-candidate:scan
          cache-from: type=gha,scope=router-${{ matrix.arch }}
          cache-to: type=gha,scope=router-${{ matrix.arch }},mode=max
      - name: Record image identity and smoke test
        run: |
          mkdir -p security-reports
          docker image inspect router-candidate:scan > security-reports/image-inspect.json
          docker run --rm router-candidate:scan --version | tee security-reports/version.txt
          grep -F '2.18.0' security-reports/version.txt
          docker save router-candidate:scan -o /tmp/router-candidate.tar
          sha256sum /tmp/router-candidate.tar > security-reports/image-archive.sha256
          git rev-parse HEAD > security-reports/source-commit.txt
          docker run --rm --entrypoint dpkg-query router-candidate:scan -W > security-reports/debian-packages.txt
      - name: Test candidate with synthetic subgraphs
        run: python3 scripts/va017_container_smoke.py router-candidate:scan security-reports
      - name: Scan actual candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: /tmp/router-candidate.tar
          scanners: vuln
          format: json
          output: security-reports/candidate.json
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          exit-code: '0'
          timeout: 15m
      - name: Scan original arm64 baseline with same database
        if: matrix.arch == 'arm64'
        run: |
          trivy image --platform linux/arm64 --skip-db-update --scanners vuln --list-all-pkgs --format json --output security-reports/baseline.json --timeout 15m docker.io/codefin/router@sha256:9a79fca41eae439c82e8feaa9a91639a9f8001a647e8516bb42409505eff4d71
      - name: Image SBOM and severity report
        env:
          SCAN_ARCH: ${{ matrix.arch }}
        run: |
          trivy version --format json > security-reports/scanner.json
          trivy image --input /tmp/router-candidate.tar --skip-db-update --format cyclonedx --output security-reports/image.cdx.json
          python3 scripts/va017_scan_summary.py security-reports
      - name: Retain reports even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ matrix.arch }}-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 90
      - name: Retain candidate for later review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.arch }}-${{ github.sha }}
          path: /tmp/router-candidate.tar
          compression-level: 0
          retention-days: 14
