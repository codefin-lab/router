name: Source security report

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
env:
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

jobs:
  source-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, Node 24
      - name: Prepare evidence directory
        run: mkdir -p security-reports
      - name: Dependency vulnerability report (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: security-reports/dependencies.json
          list-all-pkgs: 'true'
          ignore-unfixed: 'false'
          exit-code: '0'
          skip-dirs: target,.git,security-reports
          timeout: 10m
      - name: Infrastructure configuration report (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: json
          output: security-reports/configuration.json
          exit-code: '0'
          skip-dirs: target,.git,security-reports
          timeout: 10m
      - name: Record SBOM and scanner database metadata
        run: |
          trivy version --format json > security-reports/scanner.json
          trivy fs --format cyclonedx --scanners vuln --skip-db-update --skip-dirs target,.git,security-reports --output security-reports/source.cdx.json .
          git rev-parse HEAD > security-reports/source-commit.txt
      - name: Summarize raw findings
        run: |
          python3 - <<'PY'
          import collections, json, os
          from pathlib import Path
          lines = ['## Source security report', '', 'Report only: this does not approve an image release or close VA-017.', '', '| Report | Critical | High | Medium | Low | Unknown |', '| --- | ---: | ---: | ---: | ---: | ---: |']
          for filename, field in [('dependencies.json', 'Vulnerabilities'), ('configuration.json', 'Misconfigurations')]:
              report = json.loads((Path('security-reports') / filename).read_text())
              counts = collections.Counter(item.get('Severity', 'UNKNOWN') for result in report.get('Results', []) for item in (result.get(field) or []))
              lines.append('| ' + filename + ' | ' + ' | '.join(str(counts[s]) for s in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN']) + ' |')
          summary = '\n'.join(lines) + '\n'
          Path('security-reports/summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          PY
      - name: Upload security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-security-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 90
